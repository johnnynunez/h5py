name: Native CP312 data IO validation
on:
  push:
    branches: [ci/legacy-data-io-r2-20261012]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: h5py-old
            source: 2f116e1fa2ef1ccf04a0840a690a80e331403f55
    env:
      SOURCE_SHA: ${{ matrix.source }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: wrapper
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: johnnynunez/h5py
          ref: ${{ matrix.source }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Build and test native exact source
        shell: pwsh
        run: |
          python wrapper/native_lane.py ${{ matrix.mode }}
      - name: Apply exact-byte publication hold
        if: always()
        shell: pwsh
        run: python wrapper/safe_upload.py evidence upload-safe
      - name: Preserve wheels and evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.mode }}-cp312-native-evidence
          path: ${{ github.workspace }}/upload-safe
          retention-days: 14
          if-no-files-found: error
